<svg xmlns="http://www.w3.org/2000/svg" width="860" height="360" viewBox="0 0 860 360" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text','Helvetica Neue','PingFang SC','Hiragino Sans GB','Microsoft YaHei',Helvetica,Arial,sans-serif">
<style>@keyframes wave { 0%,100% { opacity: .18; } 50% { opacity: 1; } }
.w0 { animation: wave 4.2s ease-in-out 0.00s infinite; }
.w1 { animation: wave 4.2s ease-in-out 0.13s infinite; }
.w2 { animation: wave 4.2s ease-in-out 0.26s infinite; }
.w3 { animation: wave 4.2s ease-in-out 0.39s infinite; }
.w4 { animation: wave 4.2s ease-in-out 0.52s infinite; }
.w5 { animation: wave 4.2s ease-in-out 0.65s infinite; }
.w6 { animation: wave 4.2s ease-in-out 0.78s infinite; }
.w7 { animation: wave 4.2s ease-in-out 0.91s infinite; }

@keyframes flow {
  0%   { transform: translateX(-300px); }
  100% { transform: translateX(560px); }
}
@keyframes scan {
  0%        { transform: translateX(-140px) skewX(-18deg); opacity: 0; }
  8%, 92%   { opacity: .9; }
  100%      { transform: translateX(1000px) skewX(-18deg); opacity: 0; }
}
@keyframes pulse {
  0%, 88%, 100% { transform: scale(1);    opacity: 1; }
  94%           { transform: scale(2.1);  opacity: .35; }
}

.flow  { animation: flow 3.5s linear infinite; }
.scan  { animation: scan 7s ease-in-out infinite; }
.runner{ animation: pulse 4.5s ease-in-out infinite;
         transform-box: fill-box; transform-origin: center; }

@media (prefers-reduced-motion: reduce) {
  .flow, .scan, .runner, [class^="w"] { animation: none; opacity: 1; }
}
</style>
<defs>
  <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
    <circle cx="2" cy="2" r="1.4" fill="#2d343d"/>
  </pattern>
  <radialGradient id="fade" cx="50%" cy="46%" r="60%">
    <stop offset="0%" stop-color="#fff" stop-opacity="1"/>
    <stop offset="70%" stop-color="#fff" stop-opacity=".5"/>
    <stop offset="100%" stop-color="#fff" stop-opacity="0"/>
  </radialGradient>
  <mask id="dotsMask"><rect width="860" height="360" fill="url(#fade)"/></mask>

  <linearGradient id="flowGrad" x1="0" x2="1" y1="0" y2="0">
    <stop offset="0%"   stop-color="#2997ff" stop-opacity="0"/>
    <stop offset="45%"  stop-color="#2997ff" stop-opacity=".95"/>
    <stop offset="55%"  stop-color="#2997ff" stop-opacity=".95"/>
    <stop offset="100%" stop-color="#2997ff" stop-opacity="0"/>
  </linearGradient>
  <linearGradient id="scanGrad" x1="0" x2="1" y1="0" y2="0">
    <stop offset="0%"   stop-color="#2997ff" stop-opacity="0"/>
    <stop offset="50%"  stop-color="#2997ff" stop-opacity=".10"/>
    <stop offset="100%" stop-color="#2997ff" stop-opacity="0"/>
  </linearGradient>

  <clipPath id="titleClip">
    <text x="430.0" y="152" font-size="72" font-weight="680" text-anchor="middle"
          textLength="248" lengthAdjust="spacing">LilZee</text>
  </clipPath>
</defs>

<rect width="860" height="360" fill="#0d1117"/>

<g mask="url(#dotsMask)">
<g class="w0"><rect y="0.0" width="860" height="45.0" fill="url(#dots)"/></g>
<g class="w1"><rect y="45.0" width="860" height="45.0" fill="url(#dots)"/></g>
<g class="w2"><rect y="90.0" width="860" height="45.0" fill="url(#dots)"/></g>
<g class="w3"><rect y="135.0" width="860" height="45.0" fill="url(#dots)"/></g>
<g class="w4"><rect y="180.0" width="860" height="45.0" fill="url(#dots)"/></g>
<g class="w5"><rect y="225.0" width="860" height="45.0" fill="url(#dots)"/></g>
<g class="w6"><rect y="270.0" width="860" height="45.0" fill="url(#dots)"/></g>
<g class="w7"><rect y="315.0" width="860" height="45.0" fill="url(#dots)"/></g>
</g>

<g class="scan"><rect x="0" y="-40" width="120" height="440" fill="url(#scanGrad)"/></g>

<g clip-path="url(#titleClip)">
  <text x="430.0" y="152" font-size="72" font-weight="680" fill="#f5f5f7" text-anchor="middle" textLength="248" lengthAdjust="spacing">LilZee</text>
  <rect class="flow" x="0" y="86" width="200" height="82" fill="url(#flowGrad)"/>
</g>

<line x1="352" y1="206" x2="508" y2="206" stroke="#3a3a3c"
      stroke-width="1" stroke-linecap="round"/>
<circle class="runner" cx="430" cy="206" r="3.2" fill="#2997ff"/>

<text x="430.0" y="262" font-size="22" font-weight="500" fill="#a1a1a6" text-anchor="middle" textLength="252" lengthAdjust="spacing">CS student · AI × Education</text>
<text x="430.0" y="300" font-size="17" font-weight="400" fill="#86868b" text-anchor="middle" textLength="158" lengthAdjust="spacing">让 AI 学会如何教学</text>
</svg>
