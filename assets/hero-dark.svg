<svg xmlns="http://www.w3.org/2000/svg" width="860" height="360" viewBox="0 0 860 360" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text','Helvetica Neue','PingFang SC','Hiragino Sans GB','Microsoft YaHei',Helvetica,Arial,sans-serif">
<style>
/* continuous, low-amplitude motion only — never hides content */
@keyframes drift {
  0%,100% { transform: translateX(-80px); }
  50%     { transform: translateX(80px); }
}
@keyframes breathe-opacity {
  0%,100% { opacity: .40; }
  50%     { opacity: 1; }
}
@keyframes title-breathe {
  0%,100% { transform: scale(1); }
  50%     { transform: scale(1.014); }
}
@keyframes shimmer-sweep {
  0%        { transform: translateX(-360px); }
  100%      { transform: translateX(360px); }
}
@keyframes dot-blink {
  0%, 92%, 100% { transform: scale(1); opacity: 1; }
  96%           { transform: scale(1.8); opacity: 0.55; }
}

.glow    { animation: drift 16s ease-in-out infinite; transform-origin: center; }
.dots    { animation: breathe-opacity 10s ease-in-out infinite; }
.title-grp {
  animation: title-breathe 7s ease-in-out infinite;
  transform-box: fill-box; transform-origin: center;
}
.shimmer { animation: shimmer-sweep 4.5s cubic-bezier(.4,0,.2,1) infinite; }
.runner  { animation: dot-blink 4.5s ease-in-out infinite; }

@media (prefers-reduced-motion: reduce) {
  .glow, .dots, .title-grp, .shimmer, .runner { animation: none; }
}
</style>
<defs>
  <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
    <circle cx="2" cy="2" r="1.3" fill="#262c34"/>
  </pattern>
  <radialGradient id="fade" cx="50%" cy="46%" r="58%">
    <stop offset="0%" stop-color="#fff" stop-opacity="1"/>
    <stop offset="70%" stop-color="#fff" stop-opacity=".55"/>
    <stop offset="100%" stop-color="#fff" stop-opacity="0"/>
  </radialGradient>
  <mask id="dotsMask">
    <rect width="860" height="360" fill="url(#fade)"/>
  </mask>
  <radialGradient id="glow">
    <stop offset="0%" stop-color="#2997ff" stop-opacity="0.22"/>
    <stop offset="55%" stop-color="#2997ff" stop-opacity="0.066"/>
    <stop offset="100%" stop-color="#2997ff" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="shine" x1="0" x2="1" y1="0" y2="0">
    <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
    <stop offset="45%" stop-color="#ffffff" stop-opacity=".95"/>
    <stop offset="55%" stop-color="#ffffff" stop-opacity=".95"/>
    <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
  </linearGradient>
  <clipPath id="titleClip">
    <text x="430.0" y="152" font-size="72" font-weight="680" text-anchor="middle"
          textLength="248" lengthAdjust="spacing">LilZee</text>
  </clipPath>
</defs>

<rect width="860" height="360" fill="#0d1117"/>

<g class="dots" mask="url(#dotsMask)">
  <rect width="860" height="360" fill="url(#dots)"/>
</g>

<ellipse class="glow" cx="430.0" cy="150" rx="340" ry="195" fill="url(#glow)"/>

<g class="title-grp">
  <text x="430.0" y="152" font-size="72" font-weight="680" fill="#f5f5f7" text-anchor="middle" textLength="248" lengthAdjust="spacing">LilZee</text>
</g>
<g clip-path="url(#titleClip)">
  <rect class="shimmer" x="0" y="88" width="150" height="78" fill="url(#shine)"/>
</g>

<line x1="352" y1="206" x2="508" y2="206" stroke="#3a3a3c"
      stroke-width="1" stroke-linecap="round"/>
<circle class="runner" cx="430" cy="206" r="3" fill="#2997ff"/>

<text x="430.0" y="262" font-size="26" font-weight="400" fill="#a1a1a6" text-anchor="middle" textLength="282" lengthAdjust="spacing">Teach the machine to teach.</text>
<text x="430.0" y="300" font-size="17" font-weight="400" fill="#86868b" text-anchor="middle" textLength="158" lengthAdjust="spacing">让 AI 学会如何教学</text>
</svg>
